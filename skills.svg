
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="739" viewBox="0 0 900 739">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#0b1510"/>
    <stop offset="1" stop-color="#17291c"/>
  </linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#426f4a"/>
    <stop offset="1" stop-color="#1c452b"/>
  </linearGradient>
  <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#347c43"/>
    <stop offset="1" stop-color="#183b27"/>
  </linearGradient>
  <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#245b35"/>
    <stop offset=".55" stop-color="#42b85c"/>
    <stop offset="1" stop-color="#b5ed9a"/>
  </linearGradient>
  <pattern id="pixels" width="5" height="5" patternUnits="userSpaceOnUse">
    <path d="M0 0H5V5" fill="none" stroke="#07130c" stroke-width=".8" opacity=".65"/>
  </pattern>
  <pattern id="barGrid" width="7" height="18" patternUnits="userSpaceOnUse">
    <rect x="4" width="3" height="18" fill="#0c1712"/>
  </pattern>
  <style>
    @keyframes reveal {
      from { transform:scaleX(0); }
      to { transform:scaleX(1); }
    }
    .fill {
      transform-box:fill-box;
      transform-origin:left center;
      animation:reveal 1.4s cubic-bezier(.2,.8,.2,1) both;
    }
    .html {animation-delay:.2s}
    .css {animation-delay:.65s}
    .js {animation-delay:1.1s}
    .vue {animation-delay:1.55s}
    .git {animation-delay:2s}
    .label {font:13px monospace;fill:#e0eee3}
    .percent {font:12px monospace;fill:#8ee6a0}
  </style>
</defs>

<!-- Hintergrund -->
<rect width="900" height="739" fill="url(#sky)"/>
