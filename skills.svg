
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
<defs>
  <style>
    text { font-family: monospace; }
    .bgbar { fill: #382B49; }
    .on {
      fill: #61F5C8;
      animation: appear .2s steps(1) both;
    }
    .d1 { animation-delay:.2s }
    .d2 { animation-delay:.3s }
    .d3 { animation-delay:.4s }
    .d4 { animation-delay:.5s }
    .d5 { animation-delay:.6s }
    .d6 { animation-delay:.7s }
    .d7 { animation-delay:.8s }
    .d8 { animation-delay:.9s }
    .d9 { animation-delay:1s }
    .d10 { animation-delay:1.1s }
    .blink { animation: blink 1s steps(2) infinite; }
    .glow { animation: glow 2s ease-in-out infinite alternate; }
    @keyframes appear {
      from { opacity:0; }
      to { opacity:1; }
    }
    @keyframes blink {
      50% { opacity:0; }
    }
    @keyframes glow {
      from { opacity:.75; }
      to { opacity:1; }
    }
  </style>
</defs>

<rect width="1100" height="780" fill="#171222"/>
<rect x="5" y="5" width="1090" height="770" fill="none" stroke="#59416D" stroke-width="3"/>

