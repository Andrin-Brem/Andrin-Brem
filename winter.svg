<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <defs>
    <!-- Hintergrund: Indigo-Nacht mit Eisblau am Horizont -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="720">
      <stop offset="0"   stop-color="#050816"/>
      <stop offset=".25" stop-color="#0b1438"/>
      <stop offset=".42" stop-color="#1c2f73"/>
      <stop offset=".5"  stop-color="#2a4a9a"/>
      <stop offset=".58" stop-color="#0a1024"/>
      <stop offset="1"   stop-color="#080c1c"/>
    </linearGradient>

    <!-- Rahmen -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#1e3a8a" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity=".6"/>
    </linearGradient>

    <!-- Skill-Balken (1:1 wie Original) -->
    <linearGradient id="barFill" x1="0" x2="1">
      <stop offset="0" stop-color="#1f3b73"/>
      <stop offset="0.6" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <pattern id="seg" width="8" height="20" patternUnits="userSpaceOnUse">
      <rect width="6" height="20" fill="#fff"/>
    </pattern>
    <mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="720">
      <rect width="900" height="720" fill="url(#seg)"/>
    </mask>

    <!-- Low-Poly-Berge: Licht- und Schattenseite -->
    <linearGradient id="lit" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="330">
      <stop offset="0"   stop-color="#c7e9ff"/>
      <stop offset=".4"  stop-color="#5b9cf5"/>
      <stop offset="1"   stop-color="#1b3a7a"/>
    </linearGradient>
    <linearGradient id="dark" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="330">
      <stop offset="0"   stop-color="#6b8ff0"/>
      <stop offset=".4"  stop-color="#2a4bb0"/>
      <stop offset="1"   stop-color="#0f1f4d"/>
    </linearGradient>

    <!-- Schneeboden -->
    <linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="295" x2="0" y2="410">
      <stop offset="0"   stop-color="#b9d4f7"/>
      <stop offset=".45" stop-color="#5b80c9"/>
      <stop offset="1"   stop-color="#13224a"/>
    </linearGradient>

    <!-- Mondsichel -->
    <mask id="moonCut">
      <rect width="900" height="720" fill="#fff"/>
      <circle cx="748" cy="90" r="27" fill="#000"/>
    </mask>

    <!-- Verschneite Tanne (Ursprung = Fuss) -->
    <g id="pine">
      <rect x="-2" y="-6" width="4" height="6" fill="#1e293b"/>
      <g fill="#0f2a5c">
        <polygon points="0,-48 10,-32 -10,-32"/>
        <polygon points="0,-38 14,-20 -14,-20"/>
        <polygon points="0,-26 18,-6 -18,-6"/>
      </g>
      <g fill="#e0f2fe">
        <polygon points="0,-48 5,-40 -5,-40"/>
        <rect x="-10" y="-33" width="20" height="2"/>
        <rect x="-14" y="-21" width="28" height="2"/>
        <rect x="-18" y="-7"  width="36" height="2"/>
      </g>
    </g>

    <!-- Gondel (Ursprung = Seil) -->
    <g id="gondola">
      <rect x="-1" y="0" width="2" height="9" fill="#94a3b8"/>
      <rect x="-10" y="9" width="20" height="3" fill="#e0f2fe"/>
      <rect x="-9" y="12" width="18" height="12" fill="#1e3a8a"/>
      <rect x="-6" y="15" width="5" height="4" fill="#fde68a"/>
      <rect x="1"  y="15" width="5" height="4" fill="#fde68a"/>
      <rect x="-9" y="22" width="18" height="2" fill="#0f1f4d"/>
    </g>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
      .pixel { shape-rendering: crispEdges; }

      .star { animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }

      .moon { animation: glow 7s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .8 } 50% { opacity: 1 } }

      .shoot { opacity: 0; animation: shoot 13s ease-out infinite 5s; }
      @keyframes shoot {
        0%   { transform: translate(0,0); opacity: 0 }
        2%   { opacity: 1 }
        7%   { transform: translate(-170px,70px); opacity: 0 }
        100% { transform: translate(-170px,70px); opacity: 0 }
      }

      .snowFar { fill: #c7e9ff; opacity: 0; animation: fallFar 18s linear infinite; }
      @keyframes fallFar {
        0%   { transform: translate(0,0); opacity: 0 }
        10%  { opacity: .6 }
        90%  { opacity: .3 }
        100% { transform: translate(-15px,300px); opacity: 0 }
      }
      .snowNear { fill: #f0f9ff; opacity: 0; animation: fallNear 9s linear infinite; }
      @keyframes fallNear {
        0%   { transform: translate(0,0); opacity: 0 }
        10%  { opacity: .95 }
        50%  { transform: translate(18px,170px) }
        90%  { opacity: .6 }
        100% { transform: translate(-10px,360px); opacity: 0 }
      }

      .drift { fill: #e0f2fe; opacity: 0; animation: drift 7s linear infinite; }
      @keyframes drift {
        0%   { transform: translateX(0); opacity: 0 }
        20%  { opacity: .7 }
        100% { transform: translateX(-140px); opacity: 0 }
      }

      .skate { animation: skate 8s ease-in-out infinite alternate; }
      @keyframes skate { from { transform: translateX(-120px) } to { transform: translateX(120px) } }
      .lean { transform-box: fill-box; transform-origin: 50% 100%;
              animation: lean 1.3s ease-in-out infinite alternate; }
      @keyframes lean { from { transform: rotate(-7deg) } to { transform: rotate(7deg) } }

      .wave { transform-box: fill-box; transform-origin: 0% 100%;
              animation: wave 1.6s ease-in-out infinite alternate; }
      @keyframes wave { from { transform: rotate(-12deg) } to { transform: rotate(18deg) } }

      .glint { animation: glint 3.5s ease-in-out infinite; }
      @keyframes glint { 0%,100% { opacity: .15 } 50% { opacity: .8 } }

      .drip { fill: #bae6fd; animation: drip 4s ease-in infinite; }
      @keyframes drip {
        0%,60% { transform: translateY(0); opacity: 0 }
        65%    { opacity: 1 }
        100%   { transform: translateY(26px); opacity: 0 }
      }

      .head  { fill: #7dd3fc; font-size: 13px; letter-spacing: 2px; }
      .meta  { fill: #4b6cb7; font-size: 12px; text-anchor: end; }
      .label { fill: #dbeafe; font-size: 14px; }
      .bullet { fill: #38bdf8; }
      .pct   { fill: #7dd3fc; font-size: 14px; text-anchor: end; }

      /* Balken-Animation 1:1 wie Original */
      .bar { transform-box: fill-box; transform-origin: left center;
             animation: grow 1.8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>

  <!-- Hintergrund + Rahmen -->
  <rect x="1" y="1" width="898" height="718" rx="16" fill="url(#bg)" stroke="url(#frame)" stroke-width="2"/>

  <!-- Sternbild -->
  <g stroke="#7dd3fc" stroke-opacity=".22" stroke-width="1" fill="none">
    <polyline points="90,70 140,58 190,74 232,96 278,88 300,122 252,130 232,96"/>
  </g>
  <g fill="#e0f2fe">
    <circle class="star" cx="90"  cy="70"  r="1.8"/>
    <circle class="star" cx="140" cy="58"  r="1.4" style="animation-delay:-1s"/>
    <circle class="star" cx="190" cy="74"  r="1.6" style="animation-delay:-2s"/>
    <circle class="star" cx="232" cy="96"  r="2"   style="animation-delay:-3s"/>
    <circle class="star" cx="278" cy="88"  r="1.4" style="animation-delay:-.5s"/>
    <circle class="star" cx="300" cy="122" r="1.6" style="animation-delay:-1.5s"/>
    <circle class="star" cx="252" cy="130" r="1.4" style="animation-delay:-2.5s"/>
  </g>
  <!-- Einzelne Sterne -->
  <g fill="#bae6fd">
    <circle class="star" cx="380" cy="50"  r="1"   style="animation-delay:-1.2s"/>
    <circle class="star" cx="440" cy="90"  r="1.3" style="animation-delay:-2.8s"/>
    <circle class="star" cx="520" cy="45"  r="1"   style="animation-delay:-.7s"/>
    <circle class="star" cx="590" cy="100" r="1.2" style="animation-delay:-3.3s"/>
    <circle class="star" cx="640" cy="55"  r="1"   style="animation-delay:-1.9s"/>
    <circle class="star" cx="830" cy="60"  r="1.3" style="animation-delay:-2.4s"/>
    <circle class="star" cx="810" cy="140" r="1"   style="animation-delay:-.3s"/>
    <circle class="star" cx="60"  cy="140" r="1"   style="animation-delay:-3.7s"/>
  </g>

  <!-- Sternschnuppe -->
  <line class="shoot" x1="600" y1="40" x2="630" y2="28" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Mondsichel mit Halo-Ringen -->
  <g class="moon">
    <circle cx="735" cy="100" r="70" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="8"/>
    <circle cx="735" cy="100" r="50" fill="#7dd3fc" opacity=".06"/>
    <circle cx="735" cy="100" r="30" fill="#e0f2fe" mask="url(#moonCut)"/>
  </g>

  <!-- Hintere Bergkette -->
  <polygon fill="#1a2f6e" opacity=".6"
    points="40,330 40,250 110,215 170,235 250,185 330,220 400,190 470,170 540,200 610,185 680,210 760,180 860,220 860,330"/>

  <!-- Low-Poly-Gipfel links -->
  <polygon fill="url(#lit)"  points="230,130 90,330 240,330"/>
  <polygon fill="url(#dark)" points="230,130 240,330 370,330"/>
  <polygon fill="#f0f9ff" points="230,130 261,175 248,168 238,180 226,170 214,180 201,172"/>

  <!-- Low-Poly-Gipfel rechts -->
  <polygon fill="url(#lit)"  points="700,140 560,330 712,330"/>
  <polygon fill="url(#dark)" points="700,140 712,330 840,330"/>
  <polygon fill="#f0f9ff" points="700,140 729,180 717,173 706,186 694,174 682,184 671,180"/>

  <!-- Low-Poly-Hauptgipfel Mitte -->
  <polygon fill="url(#lit)"  points="470,95 300,330 480,330"/>
  <polygon fill="url(#dark)" points="470,95 480,330 640,330"/>
  <polygon fill="#ffffff" points="470,95 510,150 496,142 484,156 470,144 456,158 444,144 430,150"/>

  <!-- Grate -->
  <g fill="none" stroke="#e0f2fe" stroke-opacity=".25" stroke-width="1">
    <polyline points="230,130 214,200 205,270"/>
    <polyline points="470,95 452,180 440,260"/>
    <polyline points="700,140 686,210 678,280"/>
  </g>

  <!-- Seilbahn -->
  <g stroke="#0f1f4d" stroke-width="3">
    <line x1="300" y1="204" x2="300" y2="320"/>
    <line x1="620" y1="192" x2="620" y2="320"/>
  </g>
  <g fill="#0f1f4d">
    <rect x="290" y="200" width="20" height="4"/>
    <rect x="610" y="188" width="20" height="4"/>
  </g>
  <path d="M40 190 Q450 230 860 160" fill="none" stroke="#94a3b8" stroke-opacity=".7" stroke-width="1.2"/>
  <g>
    <use href="#gondola"/>
    <animateMotion dur="24s" repeatCount="indefinite" path="M40 190 Q450 230 860 160"/>
    <animate attributeName="opacity" dur="24s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;.05;.95;1"/>
  </g>
  <g>
    <use href="#gondola"/>
    <animateMotion dur="24s" begin="-12s" repeatCount="indefinite" path="M40 190 Q450 230 860 160"/>
    <animate attributeName="opacity" dur="24s" begin="-12s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;.05;.95;1"/>
  </g>

  <!-- Schnee hinten (langsam) -->
  <g>
    <circle class="snowFar" cx="80"  cy="30" r="1"/>
    <circle class="snowFar" cx="160" cy="30" r="1.2" style="animation-delay:-5s"/>
    <circle class="snowFar" cx="250" cy="30" r="1"   style="animation-delay:-10s"/>
    <circle class="snowFar" cx="340" cy="30" r="1.2" style="animation-delay:-3s"/>
    <circle class="snowFar" cx="430" cy="30" r="1"   style="animation-delay:-14s"/>
    <circle class="snowFar" cx="520" cy="30" r="1.2" style="animation-delay:-7s"/>
    <circle class="snowFar" cx="610" cy="30" r="1"   style="animation-delay:-12s"/>
    <circle class="snowFar" cx="700" cy="30" r="1.2" style="animation-delay:-1s"/>
    <circle class="snowFar" cx="790" cy="30" r="1"   style="animation-delay:-9s"/>
    <circle class="snowFar" cx="850" cy="30" r="1.2" style="animation-delay:-16s"/>
  </g>

  <!-- Schneeboden -->
  <path fill="url(#ground)"
    d="M40 330 Q160 300 290 322 Q420 292 560 318 Q700 296 860 316 V410 H40Z"/>
  <path fill="none" stroke="#e0f2fe" stroke-opacity=".5" stroke-width="1.5"
    d="M40 330 Q160 300 290 322 Q420 292 560 318 Q700 296 860 316"/>

  <!-- Gefrorener See -->
  <ellipse cx="470" cy="362" rx="170" ry="20" fill="#0b2552" stroke="#7dd3fc" stroke-opacity=".4"/>
  <ellipse cx="470" cy="358" rx="150" ry="12" fill="#1e3a8a" opacity=".35"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".45" stroke-width="1">
    <polyline points="360,362 380,356 394,364 412,358"/>
    <polyline points="520,366 538,360 552,368 570,361 584,366"/>
    <polyline points="440,352 452,358 446,366"/>
  </g>
  <g class="glint" fill="#e0f2fe">
    <rect x="400" y="350" width="26" height="1.5" rx=".75"/>
    <rect x="510" y="356" width="18" height="1.5" rx=".75" style="animation-delay:-1.5s"/>
    <rect x="560" y="350" width="12" height="1.5" rx=".75" style="animation-delay:-2.5s"/>
  </g>

  <!-- Eislaeufer -->
  <g transform="translate(470,369)">
    <g class="skate">
      <g class="lean">
        <rect x="-5" y="0" width="10" height="1.5" fill="#e2e8f0"/>
        <rect x="-3" y="-10" width="2" height="10" fill="#1e3a8a"/>
        <rect x="1"  y="-10" width="2" height="10" fill="#1e3a8a"/>
        <rect x="-4" y="-20" width="8" height="10" fill="#2563eb"/>
        <rect x="-8" y="-18" width="4" height="2" fill="#2563eb"/>
        <rect x="4"  y="-18" width="4" height="2" fill="#2563eb"/>
        <rect x="-4" y="-21" width="8" height="2" fill="#7dd3fc"/>
        <rect x="3"  y="-21" width="5" height="2" fill="#7dd3fc"/>
        <circle cx="0" cy="-24.5" r="3.5" fill="#f1f5f9"/>
        <rect x="-4" y="-29" width="8" height="3" fill="#38bdf8"/>
        <circle cx="0" cy="-30" r="1.5" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Tannen -->
  <use href="#pine" transform="translate(70,338) scale(.9)"/>
  <use href="#pine" transform="translate(95,334) scale(1.15)"/>
  <use href="#pine" transform="translate(120,338) scale(.75)"/>
  <use href="#pine" transform="translate(252,322) scale(.6)"/>
  <use href="#pine" transform="translate(268,324) scale(.45)"/>
  <use href="#pine" transform="translate(665,316) scale(.55)"/>
  <use href="#pine" transform="translate(770,320) scale(.85)"/>
  <use href="#pine" transform="translate(797,318) scale(1.2)"/>
  <use href="#pine" transform="translate(826,320) scale(.8)"/>

  <!-- Schneemann -->
  <g transform="translate(180,378)">
    <ellipse cx="0" cy="0" rx="16" ry="3" fill="#13224a" opacity=".4"/>
    <circle cx="0" cy="-12" r="12"  fill="#e0f2fe"/>
    <circle cx="0" cy="-30" r="9"   fill="#f0f9ff"/>
    <circle cx="0" cy="-44" r="6.5" fill="#ffffff"/>
    <rect x="-6" y="-37" width="12" height="3" fill="#38bdf8"/>
    <rect x="3"  y="-37" width="3" height="8" fill="#38bdf8"/>
    <circle cx="-2.5" cy="-45" r="1" fill="#0f172a"/>
    <circle cx="2.5"  cy="-45" r="1" fill="#0f172a"/>
    <polygon points="0,-43 7,-42 0,-41" fill="#fb923c"/>
    <rect x="-6" y="-51" width="12" height="2" fill="#0f172a"/>
    <rect x="-4" y="-58" width="8" height="7" fill="#0f172a"/>
    <circle cx="0" cy="-30" r="1" fill="#1e3a8a"/>
    <circle cx="0" cy="-25" r="1" fill="#1e3a8a"/>
    <line x1="-8" y1="-31" x2="-20" y2="-38" stroke="#475569" stroke-width="2"/>
    <line class="wave" x1="8" y1="-32" x2="20" y2="-42" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Schneewehen am Boden -->
  <g>
    <rect class="drift" x="300" y="392" width="3" height="1.5"/>
    <rect class="drift" x="520" y="396" width="4" height="1.5" style="animation-delay:-2s"/>
    <rect class="drift" x="760" y="390" width="3" height="1.5" style="animation-delay:-4s"/>
    <rect class="drift" x="660" y="398" width="4" height="1.5" style="animation-delay:-5.5s"/>
  </g>

  <!-- Schnee vorne (schnell, grosse Flocken) -->
  <g class="pixel">
    <rect class="snowNear" x="110" y="20" width="3" height="3"/>
    <rect class="snowNear" x="230" y="20" width="2" height="2" style="animation-delay:-3s"/>
    <rect class="snowNear" x="350" y="20" width="3" height="3" style="animation-delay:-6s"/>
    <rect class="snowNear" x="470" y="20" width="2" height="2" style="animation-delay:-1.5s"/>
    <rect class="snowNear" x="590" y="20" width="3" height="3" style="animation-delay:-4.5s"/>
    <rect class="snowNear" x="710" y="20" width="2" height="2" style="animation-delay:-7.5s"/>
    <rect class="snowNear" x="820" y="20" width="3" height="3" style="animation-delay:-2.2s"/>
  </g>

  <!-- Skills: Panel mit Schneedecke und Eiszapfen -->
  <rect x="60" y="430" width="780" height="220" rx="12" fill="#0f1b3d" fill-opacity=".75"
        stroke="#7dd3fc" stroke-opacity=".3"/>
  <path fill="#dbeafe"
    d="M60 436 V430 Q90 418 130 426 Q175 416 220 425 Q270 417 320 426 Q370 418 420 425 Q470 416 520 426 Q570 418 620 425 Q670 417 720 426 Q770 418 810 425 Q832 421 840 430 V436 Z"/>
  <g fill="#bae6fd" opacity=".75">
    <polygon points="86,436 94,436 90,450"/>
    <polygon points="114,436 122,436 118,444"/>
    <polygon points="156,436 164,436 160,454"/>
    <polygon points="201,436 209,436 205,446"/>
    <polygon points="258,436 266,436 262,451"/>
    <polygon points="326,436 334,436 330,445"/>
    <polygon points="391,436 399,436 395,456"/>
    <polygon points="446,436 454,436 450,448"/>
    <polygon points="516,436 524,436 520,452"/>
    <polygon points="581,436 589,436 585,445"/>
    <polygon points="636,436 644,436 640,454"/>
    <polygon points="696,436 704,436 700,447"/>
    <polygon points="756,436 764,436 760,451"/>
    <polygon points="806,436 814,436 810,445"/>
  </g>
  <circle class="drip" cx="640" cy="456" r="1.6"/>
  <circle class="drip" cx="395" cy="458" r="1.4" style="animation-delay:-2s"/>

  <text class="head" x="84" y="478">&#10052; SNOWFALL // SKILLS</text>
  <text class="meta" x="816" y="478">[ -12&#176;C ]</text>
  <line x1="84" y1="488" x2="816" y2="488" stroke="#38bdf8" stroke-opacity=".3" stroke-dasharray="2 5"/>

  <text class="label" x="84" y="510"><tspan class="bullet">* </tspan>HTML</text>
  <text class="label" x="84" y="540"><tspan class="bullet">* </tspan>CSS</text>
  <text class="label" x="84" y="570"><tspan class="bullet">* </tspan>JavaScript</text>
  <text class="label" x="84" y="600"><tspan class="bullet">* </tspan>Vue</text>
  <text class="label" x="84" y="630"><tspan class="bullet">* </tspan>Git</text>

  <!-- Balken 1:1 wie Original -->
  <g mask="url(#segs)">
    <rect x="210" y="496" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="526" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="556" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="586" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="616" width="560" height="18" fill="#1a2433"/>
    <!-- width = 560 * Prozent -->
    <rect class="bar" x="210" y="496" width="504" height="18" fill="url(#barFill)"/>
    <rect class="bar" x="210" y="526" width="448" height="18" fill="url(#barFill)" style="animation-delay:.15s"/>
    <rect class="bar" x="210" y="556" width="392" height="18" fill="url(#barFill)" style="animation-delay:.3s"/>
    <rect class="bar" x="210" y="586" width="224" height="18" fill="url(#barFill)" style="animation-delay:.45s"/>
    <rect class="bar" x="210" y="616" width="280" height="18" fill="url(#barFill)" style="animation-delay:.6s"/>
  </g>

  <text class="pct" x="816" y="510">90%</text>
  <text class="pct" x="816" y="540">80%</text>
  <text class="pct" x="816" y="570">70%</text>
  <text class="pct" x="816" y="600">40%</text>
  <text class="pct" x="816" y="630">50%</text>

  <!-- Footer: Pixel-Schneeflocke -->
  <g stroke="#38bdf8" stroke-opacity=".4" stroke-dasharray="2 6">
    <line x1="300" y1="686" x2="425" y2="686"/>
    <line x1="475" y1="686" x2="600" y2="686"/>
  </g>
  <g class="pixel star" fill="#bae6fd">
    <rect x="449" y="677" width="2"  height="18"/>
    <rect x="441" y="685" width="18" height="2"/>
    <rect x="443" y="679" width="2" height="2"/>
    <rect x="455" y="679" width="2" height="2"/>
    <rect x="443" y="691" width="2" height="2"/>
    <rect x="455" y="691" width="2" height="2"/>
  </g>
</svg>
