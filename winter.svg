<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
  <defs>
    <!-- Himmel -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.5" stop-color="#0d1426"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Polarlicht -->
    <linearGradient id="aurora" x1="0" x2="1">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#39c5cf"/>
      <stop offset="0.6" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>

    <!-- Skill-Balken (wie Original) -->
    <linearGradient id="barFill" x1="0" x2="1">
      <stop offset="0" stop-color="#1f3b73"/>
      <stop offset="0.6" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <pattern id="seg" width="8" height="20" patternUnits="userSpaceOnUse">
      <rect width="6" height="20" fill="#fff"/>
    </pattern>
    <mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="660">
      <rect width="900" height="660" fill="url(#seg)"/>
    </mask>

    <!-- Mond als Sichel -->
    <mask id="moonCut">
      <rect width="900" height="660" fill="#fff"/>
      <circle cx="652" cy="58" r="15" fill="#000"/>
    </mask>

    <!-- Scanlines -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#fff"/>
    </pattern>
    <mask id="scanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="660">
      <rect width="900" height="660" fill="url(#scan)"/>
    </mask>

    <!-- Bergfarben -->
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="312">
      <stop offset="0" stop-color="#2b4f8f"/>
      <stop offset="1" stop-color="#0f1b36"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="312">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.4" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#172e5c"/>
    </linearGradient>
    <linearGradient id="near" gradientUnits="userSpaceOnUse" x1="0" y1="265" x2="0" y2="312">
      <stop offset="0" stop-color="#14295a"/>
      <stop offset="1" stop-color="#0a1630"/>
    </linearGradient>
    <linearGradient id="snow" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="176">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cae8ff"/>
    </linearGradient>

    <!-- Bergformen -->
    <polygon id="farShape" fill="url(#far)"
      points="60,312 60,230 120,200 180,215 250,170 330,195 420,150 470,175 560,140 630,180 690,165 760,185 840,160 840,312"/>
    <polygon id="midShape" fill="url(#mid)"
      points="60,312 60,255 140,215 200,235 290,140 360,215 400,198 500,95 590,210 640,190 720,150 790,220 840,205 840,312"/>
    <polygon id="nearShape" fill="url(#near)"
      points="60,312 60,285 130,272 200,290 280,268 360,288 430,276 520,294 600,270 680,290 760,276 840,288 840,312"/>

    <!-- Tanne -->
    <g id="pine">
      <polygon points="0,0 5,8 -5,8"/>
      <polygon points="0,4 7,14 -7,14"/>
      <polygon points="0,9 9,20 -9,20"/>
      <polygon points="0,14 11,25 -11,25"/>
    </g>

    <clipPath id="lake">
      <rect x="60" y="316" width="780" height="58"/>
    </clipPath>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }

      .star { fill: #e6f3ff; animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .95 } }

      .aurora { animation: aurora 14s ease-in-out infinite alternate; }
      @keyframes aurora {
        from { transform: translate(-20px, 0); opacity: .3 }
        to   { transform: translate(20px, 10px); opacity: .65 }
      }

      .moon { animation: glow 7s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .75 } 50% { opacity: 1 } }

      .shoot { opacity: 0; animation: shoot 11s ease-out infinite 3s; }
      @keyframes shoot {
        0%   { transform: translate(0, 0); opacity: 0 }
        2%   { opacity: 1 }
        8%   { transform: translate(200px, 70px); opacity: 0 }
        100% { transform: translate(200px, 70px); opacity: 0 }
      }

      .flake { fill: #cae8ff; opacity: 0; animation: fall 13s linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0, 0); opacity: 0 }
        15%  { opacity: .7 }
        50%  { transform: translate(-12px, 140px) }
        90%  { opacity: .4 }
        100% { transform: translate(8px, 270px); opacity: 0 }
      }

      .snowcap { animation: shimmer 6s ease-in-out infinite; }
      @keyframes shimmer { 0%,100% { opacity: .85 } 50% { opacity: 1 } }

      .ripple { animation: ripple 7s linear infinite; }
      @keyframes ripple { to { stroke-dashoffset: -160 } }

      .glint { animation: glint 3s ease-in-out infinite; }
      @keyframes glint { 0%,100% { opacity: .3 } 50% { opacity: .9 } }

      .wtitle { fill: #8b949e; font-size: 12px; text-anchor: middle; }
      .label  { fill: #c9d1d9; font-size: 13px; }
      .pct    { fill: #79c0ff; font-size: 13px; text-anchor: end; }
      .key    { fill: #39c5cf; }

      /* Balken-Animation wie Original */
      .bar { transform-box: fill-box; transform-origin: left center;
             animation: grow 1.8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }

      .tree { animation: twinkle 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Hintergrund mit Rahmen -->
  <rect x="1" y="1" width="898" height="658" rx="18" fill="url(#sky)" stroke="#21262d" stroke-width="2"/>

  <!-- Polarlicht -->
  <g filter="url(#blur)">
    <path class="aurora" d="M 40 120 C 180 50, 300 150, 450 85 S 700 40, 860 105"
          fill="none" stroke="url(#aurora)" stroke-width="20" stroke-linecap="round"/>
    <path class="aurora" style="animation-delay:-6s; animation-duration:18s"
          d="M 80 150 C 230 100, 360 170, 520 120 S 760 95, 840 140"
          fill="none" stroke="url(#aurora)" stroke-width="10" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- Sterne -->
  <circle class="star" cx="95"  cy="48"  r="1.4"/>
  <circle class="star" cx="170" cy="92"  r="1"   style="animation-delay:-1.3s"/>
  <circle class="star" cx="250" cy="40"  r="1.6" style="animation-delay:-2.6s"/>
  <circle class="star" cx="335" cy="70"  r="1"   style="animation-delay:-0.8s"/>
  <circle class="star" cx="410" cy="38"  r="1.3" style="animation-delay:-3.2s"/>
  <circle class="star" cx="480" cy="62"  r="1"   style="animation-delay:-1.9s"/>
  <circle class="star" cx="560" cy="34"  r="1.5" style="animation-delay:-2.2s"/>
  <circle class="star" cx="740" cy="44"  r="1"   style="animation-delay:-0.5s"/>
  <circle class="star" cx="800" cy="88"  r="1.4" style="animation-delay:-3.6s"/>
  <circle class="star" cx="855" cy="40"  r="1"   style="animation-delay:-1.1s"/>
  <circle class="star" cx="300" cy="118" r="1"   style="animation-delay:-2.9s"/>
  <circle class="star" cx="600" cy="105" r="1.2" style="animation-delay:-0.2s"/>

  <!-- Sternschnuppe -->
  <line class="shoot" x1="180" y1="40" x2="150" y2="30" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Mond -->
  <g class="moon">
    <circle cx="645" cy="62" r="30" fill="#79c0ff" opacity=".06"/>
    <circle cx="645" cy="62" r="16" fill="#e6f3ff" mask="url(#moonCut)"/>
  </g>

  <!-- Berge -->
  <g mask="url(#scanMask)">
    <use href="#farShape" opacity=".75"/>
    <use href="#midShape"/>
    <g class="snowcap" fill="url(#snow)">
      <polygon points="290,140 308,159 300,156 293,165 284,158 276,166 268,164"/>
      <polygon points="500,95 525,127 514,122 505,133 494,123 483,131 472,124"/>
      <polygon points="720,150 744,174 734,168 725,176 713,166 702,171 692,164"/>
    </g>
    <use href="#nearShape"/>
    <g fill="#0a1630">
      <use href="#pine" x="120" y="250"/>
      <use href="#pine" x="136" y="255"/>
      <use href="#pine" x="290" y="245"/>
      <use href="#pine" x="305" y="251"/>
      <use href="#pine" x="590" y="247"/>
      <use href="#pine" x="606" y="253"/>
      <use href="#pine" x="770" y="253"/>
      <use href="#pine" x="786" y="259"/>
    </g>
  </g>

  <!-- Kontur am Hauptkamm -->
  <polyline fill="none" stroke="#cae8ff" stroke-opacity=".35" stroke-width="1"
    points="60,255 140,215 200,235 290,140 360,215 400,198 500,95 590,210 640,190 720,150 790,220 840,205"/>

  <!-- Schneeflocken -->
  <circle class="flake" cx="110" cy="30" r="1.5"/>
  <circle class="flake" cx="205" cy="30" r="1.2" style="animation-delay:-4s; animation-duration:15s"/>
  <circle class="flake" cx="315" cy="30" r="1.8" style="animation-delay:-8s"/>
  <circle class="flake" cx="430" cy="30" r="1.2" style="animation-delay:-2s; animation-duration:12s"/>
  <circle class="flake" cx="545" cy="30" r="1.6" style="animation-delay:-10s"/>
  <circle class="flake" cx="660" cy="30" r="1.2" style="animation-delay:-6s; animation-duration:14s"/>
  <circle class="flake" cx="760" cy="30" r="1.7" style="animation-delay:-1s"/>
  <circle class="flake" cx="840" cy="30" r="1.2" style="animation-delay:-11s; animation-duration:16s"/>

  <!-- See mit Spiegelung -->
  <rect x="60" y="314" width="780" height="62" fill="#0b1324"/>
  <g clip-path="url(#lake)" opacity=".28" filter="url(#soft)">
    <g transform="translate(0,630) scale(1,-1)">
      <use href="#midShape"/>
      <use href="#nearShape"/>
    </g>
  </g>
  <line x1="60" y1="314" x2="840" y2="314" stroke="#58a6ff" stroke-opacity=".5"/>
  <g stroke="#58a6ff" stroke-linecap="round">
    <line class="ripple" x1="80" y1="332" x2="820" y2="332" stroke-opacity=".35" stroke-dasharray="30 18 8 24"/>
    <line class="ripple" x1="100" y1="348" x2="800" y2="348" stroke-opacity=".25" stroke-dasharray="18 26 40 16" style="animation-duration:9s"/>
    <line class="ripple" x1="130" y1="364" x2="770" y2="364" stroke-opacity=".15" stroke-dasharray="12 30 22 20" style="animation-duration:11s"/>
  </g>
  <g class="glint" fill="#e6f3ff">
    <rect x="633" y="324" width="22" height="2" rx="1"/>
    <rect x="638" y="336" width="14" height="2" rx="1"/>
    <rect x="641" y="350" width="8"  height="2" rx="1"/>
  </g>

  <!-- Skills als Terminal-Fenster -->
  <rect x="60" y="398" width="780" height="206" rx="10" fill="#0f1623" stroke="#1f6feb" stroke-opacity=".35"/>
  <path d="M 60 426 H 840" stroke="#1f6feb" stroke-opacity=".25"/>
  <circle cx="80"  cy="412" r="5" fill="#ff5f57"/>
  <circle cx="97"  cy="412" r="5" fill="#febc2e"/>
  <circle cx="114" cy="412" r="5" fill="#28c840"/>
  <text class="wtitle" x="450" y="416">~/skills.json</text>

  <text class="label" x="90" y="456"><tspan class="key">"</tspan>HTML<tspan class="key">"</tspan></text>
  <text class="label" x="90" y="486"><tspan class="key">"</tspan>CSS<tspan class="key">"</tspan></text>
  <text class="label" x="90" y="516"><tspan class="key">"</tspan>JavaScript<tspan class="key">"</tspan></text>
  <text class="label" x="90" y="546"><tspan class="key">"</tspan>Vue<tspan class="key">"</tspan></text>
  <text class="label" x="90" y="576"><tspan class="key">"</tspan>Git<tspan class="key">"</tspan></text>

  <!-- Balken 1:1 wie Original -->
  <g mask="url(#segs)">
    <rect x="210" y="442" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="472" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="502" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="532" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="562" width="560" height="18" fill="#1a2433"/>
    <!-- width = 560 * Prozent -->
    <rect class="bar" x="210" y="442" width="476" height="18" fill="url(#barFill)"/>
    <rect class="bar" x="210" y="472" width="448" height="18" fill="url(#barFill)" style="animation-delay:.15s"/>
    <rect class="bar" x="210" y="502" width="336" height="18" fill="url(#barFill)" style="animation-delay:.3s"/>
    <rect class="bar" x="210" y="532" width="224" height="18" fill="url(#barFill)" style="animation-delay:.45s"/>
    <rect class="bar" x="210" y="562" width="308" height="18" fill="url(#barFill)" style="animation-delay:.6s"/>
  </g>

  <text class="pct" x="820" y="456">85%</text>
  <text class="pct" x="820" y="486">80%</text>
  <text class="pct" x="820" y="516">60%</text>
  <text class="pct" x="820" y="546">40%</text>
  <text class="pct" x="820" y="576">55%</text>

  <!-- Deko unten: kleiner Tannenwald -->
  <g fill="#1f6feb">
    <use class="tree" href="#pine" transform="translate(390,620) scale(.6)"/>
    <use class="tree" href="#pine" transform="translate(410,624) scale(.45)" style="animation-delay:-.6s"/>
    <use class="tree" href="#pine" transform="translate(430,618) scale(.7)"  style="animation-delay:-1.2s"/>
    <use class="tree" href="#pine" transform="translate(450,615) scale(.85)" style="animation-delay:-1.8s"/>
    <use class="tree" href="#pine" transform="translate(470,618) scale(.7)"  style="animation-delay:-2.4s"/>
    <use class="tree" href="#pine" transform="translate(490,624) scale(.45)" style="animation-delay:-3s"/>
    <use class="tree" href="#pine" transform="translate(510,620) scale(.6)"  style="animation-delay:-3.6s"/>
  </g>
</svg>
