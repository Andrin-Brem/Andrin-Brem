<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <!-- Hintergrund: dunkel oben, Leuchten am Horizont -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="700">
      <stop offset="0"   stop-color="#070b1a"/>
      <stop offset=".3"  stop-color="#0e1a38"/>
      <stop offset=".46" stop-color="#1a3563"/>
      <stop offset=".55" stop-color="#0d1117"/>
      <stop offset="1"   stop-color="#0d1117"/>
    </linearGradient>

    <!-- Polarlicht als Vorhang -->
    <linearGradient id="curtain" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="215">
      <stop offset="0"   stop-color="#a371f7" stop-opacity="0"/>
      <stop offset=".35" stop-color="#58a6ff" stop-opacity=".7"/>
      <stop offset=".75" stop-color="#39c5cf" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#39c5cf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="vstripe" width="6" height="10" patternUnits="userSpaceOnUse">
      <rect width="3" height="10" fill="#fff"/>
    </pattern>
    <mask id="auroraMask" maskUnits="userSpaceOnUse" x="-100" y="0" width="1100" height="260">
      <path fill="url(#vstripe)"
        d="M60 210 C200 150, 300 230, 450 170 S700 120, 840 190 L840 60 C700 20, 560 90, 450 60 S220 30, 60 90 Z"/>
    </mask>
    <filter id="glowBlur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Skill-Balken (1:1 wie Original) -->
    <linearGradient id="barFill" x1="0" x2="1">
      <stop offset="0" stop-color="#1f3b73"/>
      <stop offset="0.6" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <pattern id="seg" width="8" height="20" patternUnits="userSpaceOnUse">
      <rect width="6" height="20" fill="#fff"/>
    </pattern>
    <mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="700">
      <rect width="900" height="700" fill="url(#seg)"/>
    </mask>

    <!-- Bergfarben -->
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="322">
      <stop offset="0" stop-color="#24467f"/>
      <stop offset="1" stop-color="#0e1a36"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="105" x2="0" y2="322">
      <stop offset="0" stop-color="#6cb6ff"/>
      <stop offset=".4" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#13285a"/>
    </linearGradient>
    <linearGradient id="snow" gradientUnits="userSpaceOnUse" x1="0" y1="105" x2="0" y2="182">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cae8ff"/>
    </linearGradient>

    <!-- Dither-Muster fuer Retro-Look -->
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000" fill-opacity=".18"/>
      <rect x="2" y="2" width="2" height="2" fill="#000" fill-opacity=".18"/>
    </pattern>

    <!-- Treppen-Berge (8-Bit-Stil) -->
    <path id="farShape"
      d="M60 322V240H90V228H120V214H150V200H180V212H210V224H240V210H270V196H300V182H330V196H360V210H390V198H420V186H450V174H480V188H510V200H540V186H570V172H600V160H630V174H660V188H690V176H720V164H750V178H780V192H810V180H840V322Z"/>
    <path id="midShape"
      d="M60 "/>
    <path id="nearShape"
      d="M60 322V296H120V288H180V280H230V288H300V298H360V290H420V284H480V292H540V300H600V290H660V282H720V276H780V286H840V322Z"/>

    <!-- Schneegrenze: alles darueber wird weiss -->
    <clipPath id="snowLine">
      <path d="M0 0H900V176H660V168H620V180H560V172H500V182H440V172H400V180H330V170H300V178H250V170H200V176H0Z"/>
    </clipPath>

    <!-- See -->
    <clipPath id="lakeClip">
      <rect x="60" y="323" width="780" height="58"/>
    </clipPath>
    <pattern id="hstripe" width="900" height="5" patternUnits="userSpaceOnUse">
      <rect width="900" height="3" fill="#fff"/>
    </pattern>
    <mask id="waterMask" maskUnits="userSpaceOnUse" x="0" y="300" width="900" height="100">
      <rect y="300" width="900" height="100" fill="url(#hstripe)"/>
    </mask>

    <!-- Pixel-Tanne (Ursprung = Fuss) -->
    <g id="pine">
      <rect x="-2"   y="-26" width="4"  height="4"/>
      <rect x="-4"   y="-22" width="8"  height="5"/>
      <rect x="-6"   y="-17" width="12" height="5"/>
      <rect x="-8"   y="-12" width="16" height="6"/>
      <rect x="-10"  y="-6"  width="20" height="4"/>
      <rect x="-1.5" y="-2"  width="3"  height="2"/>
      <rect x="-2"   y="-26" width="4"  height="2" fill="#cae8ff" fill-opacity=".7"/>
    </g>

    <!-- Funkelstern -->
    <g id="spark">
      <rect x="-1" y="-4" width="2" height="8"/>
      <rect x="-4" y="-1" width="8" height="2"/>
    </g>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
      .pixel { shape-rendering: crispEdges; }

      .star { animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }

      .curtain { animation: curtain 12s ease-in-out infinite alternate; }
      @keyframes curtain {
        from { transform: translateX(-15px); opacity: .35 }
        to   { transform: translateX(15px);  opacity: .8 }
      }

      .moon { animation: glow 7s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .8 } 50% { opacity: 1 } }
      .halo { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .sat { animation: sat 38s linear infinite, satblink 1.4s steps(1) infinite; }
      @keyframes sat { from { transform: translateX(0) } to { transform: translateX(940px) } }
      @keyframes satblink { 0% { opacity: 1 } 50% { opacity: .2 } }

      .flake { fill: #cae8ff; opacity: 0; animation: fall 12s linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0,0); opacity: 0 }
        12%  { opacity: .8 }
        88%  { opacity: .4 }
        100% { transform: translate(-20px,290px); opacity: 0 }
      }

      .flicker { animation: flicker 2.4s steps(2) infinite; }
      @keyframes flicker { 0%,100% { opacity: 1 } 35% { opacity: .6 } 70% { opacity: .9 } }

      .smoke { fill: #8b949e; opacity: 0; animation: smoke 5s ease-out infinite; }
      @keyframes smoke {
        0%   { transform: translate(0,0); opacity: 0 }
        15%  { opacity: .5 }
        100% { transform: translate(-12px,-42px); opacity: 0 }
      }

      .glint { animation: glint 3s ease-in-out infinite; }
      @keyframes glint { 0%,100% { opacity: .25 } 50% { opacity: .9 } }

      .streak { animation: streak 6s ease-in-out infinite alternate; }
      @keyframes streak {
        from { transform: translateX(-12px); opacity: .15 }
        to   { transform: translateX(12px);  opacity: .5 }
      }

      .head  { fill: #79c0ff; font-size: 13px; letter-spacing: 2px; }
      .meta  { fill: #3b5a8a; font-size: 12px; text-anchor: end; }
      .label { fill: #cae8ff; font-size: 14px; }
      .idx   { fill: #3b5a8a; }
      .pct   { fill: #58a6ff; font-size: 14px; text-anchor: end; }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }

      /* Balken-Animation 1:1 wie Original */
      .bar { transform-box: fill-box; transform-origin: left center;
             animation: grow 1.8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>

  <!-- Hintergrund + Innenrahmen -->
  <rect width="900" height="700" rx="14" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="672" rx="8" fill="none" stroke="#1f3b73" stroke-opacity=".6"/>

  <!-- Polarlicht-Vorhang -->
  <g class="curtain" style="animation-delay:-3s" filter="url(#glowBlur)" opacity=".25">
    <path fill="url(#curtain)"
      d="M60 210 C200 150, 300 230, 450 170 S700 120, 840 190 L840 60 C700 20, 560 90, 450 60 S220 30, 60 90 Z"/>
  </g>
  <g class="curtain" mask="url(#auroraMask)">
    <rect x="40" y="30" width="820" height="200" fill="url(#curtain)"/>
  </g>

  <!-- Sterne -->
  <g fill="#e6f3ff" class="pixel">
    <use class="star" href="#spark" x="300" y="58"/>
    <use class="star" href="#spark" x="565" y="46"  style="animation-delay:-2s"/>
    <use class="star" href="#spark" x="820" y="92"  style="animation-delay:-3.4s"/>
    <rect class="star" x="90"  y="60"  width="3" height="3" style="animation-delay:-1.1s"/>
    <rect class="star" x="250" y="110" width="2" height="2" style="animation-delay:-2.7s"/>
    <rect class="star" x="380" y="40"  width="3" height="3" style="animation-delay:-.5s"/>
    <rect class="star" x="470" y="80"  width="2" height="2" style="animation-delay:-3s"/>
    <rect class="star" x="640" y="70"  width="3" height="3" style="animation-delay:-1.7s"/>
    <rect class="star" x="720" y="40"  width="2" height="2" style="animation-delay:-.9s"/>
    <rect class="star" x="770" y="140" width="2" height="2" style="animation-delay:-2.2s"/>
    <rect class="star" x="855" y="50"  width="3" height="3" style="animation-delay:-3.8s"/>
  </g>

  <!-- Satellit -->
  <rect class="sat pixel" x="-20" y="64" width="2" height="2" fill="#ffffff"/>

  <!-- Vollmond links -->
  <g class="moon">
    <circle cx="190" cy="120" r="62" fill="#79c0ff" opacity=".05"/>
    <circle cx="190" cy="120" r="44" fill="#79c0ff" opacity=".08"/>
    <circle class="halo" cx="190" cy="120" r="52" fill="none" stroke="#a5d6ff" stroke-opacity=".3" stroke-dasharray="1 6"/>
    <circle cx="190" cy="120" r="28" fill="#e6f3ff"/>
    <circle cx="181" cy="112" r="5"   fill="#c4dcf5"/>
    <circle cx="199" cy="128" r="4"   fill="#c4dcf5"/>
    <circle cx="198" cy="110" r="2.5" fill="#c4dcf5"/>
    <circle cx="184" cy="131" r="2"   fill="#c4dcf5"/>
  </g>

  <!-- Berge -->
  <g class="pixel">
    <use href="#farShape" fill="url(#far)" opacity=".8"/>
    <use href="#midShape" fill="url(#mid)"/>
    <use href="#midShape" fill="url(#dither)"/>
    <use href="#midShape" fill="url(#snow)" clip-path="url(#snowLine)"/>
    <use href="#nearShape" fill="#0b1a36"/>
  </g>

  <!-- Tannen -->
  <g fill="#081329" class="pixel">
    <use href="#pine" x="92"  y="296"/>
    <use href="#pine" x="106" y="296"/>
    <use href="#pine" x="195" y="280"/>
    <use href="#pine" x="210" y="280"/>
    <use href="#pine" x="390" y="290"/>
    <use href="#pine" x="500" y="292"/>
    <use href="#pine" x="514" y="292"/>
    <use href="#pine" x="620" y="290"/>
    <use href="#pine" x="634" y="290"/>
    <use href="#pine" x="805" y="286"/>
    <use href="#pine" x="820" y="286"/>
  </g>

  <!-- Huette mit Licht -->
  <g class="pixel">
    <circle cx="734" cy="268" r="16" fill="#ffd27a" opacity=".08"/>
    <rect x="746" y="244" width="4" height="10" fill="#1a2b4a"/>
    <rect x="726" y="262" width="28" height="14" fill="#1a2b4a"/>
    <rect x="722" y="258" width="36" height="4" fill="#cae8ff"/>
    <rect x="726" y="254" width="28" height="4" fill="#cae8ff"/>
    <rect x="732" y="250" width="16" height="4" fill="#cae8ff"/>
    <rect class="flicker" x="731" y="266" width="6" height="5" fill="#ffd27a"/>
    <rect x="743" y="267" width="6" height="9" fill="#0d1426"/>
    <rect class="smoke" x="747" y="240" width="3" height="3"/>
    <rect class="smoke" x="747" y="240" width="3" height="3" style="animation-delay:-1.7s"/>
    <rect class="smoke" x="747" y="240" width="3" height="3" style="animation-delay:-3.4s"/>
  </g>

  <!-- Schneeflocken als Pixel -->
  <g class="pixel">
    <rect class="flake" x="100" y="30" width="2" height="2"/>
    <rect class="flake" x="190" y="30" width="3" height="3" style="animation-delay:-4s; animation-duration:14s"/>
    <rect class="flake" x="285" y="30" width="2" height="2" style="animation-delay:-8s"/>
    <rect class="flake" x="370" y="30" width="3" height="3" style="animation-delay:-2s; animation-duration:11s"/>
    <rect class="flake" x="455" y="30" width="2" height="2" style="animation-delay:-10s"/>
    <rect class="flake" x="545" y="30" width="3" height="3" style="animation-delay:-6s; animation-duration:13s"/>
    <rect class="flake" x="630" y="30" width="2" height="2" style="animation-delay:-1s"/>
    <rect class="flake" x="720" y="30" width="3" height="3" style="animation-delay:-7s; animation-duration:15s"/>
    <rect class="flake" x="810" y="30" width="2" height="2" style="animation-delay:-11s"/>
  </g>

  <!-- See mit gestreifter Spiegelung -->
  <rect x="60" y="322" width="780" height="60" fill="#0a1428"/>
  <g clip-path="url(#lakeClip)">
    <g mask="url(#waterMask)" opacity=".3">
      <g transform="translate(0,644) scale(1,-1)">
        <use href="#midShape" fill="url(#mid)"/>
        <use href="#nearShape" fill="#0b1a36"/>
      </g>
    </g>
  </g>
  <line x1="60" y1="322" x2="840" y2="322" stroke="#58a6ff" stroke-opacity=".45"/>

  <!-- Lichtstreifen auf dem Wasser -->
  <g fill="#58a6ff" class="pixel">
    <rect class="streak" x="300" y="340" width="40" height="2"/>
    <rect class="streak" x="480" y="352" width="60" height="2" style="animation-delay:-2s"/>
    <rect class="streak" x="600" y="366" width="30" height="2" style="animation-delay:-4s"/>
    <rect class="streak" x="100" y="360" width="36" height="2" style="animation-delay:-3s"/>
  </g>

  <!-- Mondspiegelung -->
  <g class="glint pixel" fill="#e6f3ff">
    <rect x="178" y="332" width="24" height="2"/>
    <rect x="182" y="342" width="16" height="2"/>
    <rect x="185" y="352" width="10" height="2"/>
    <rect x="187" y="362" width="6"  height="2"/>
  </g>
  <!-- Fensterspiegelung der Huette -->
  <g class="flicker pixel" fill="#ffd27a" opacity=".6">
    <rect x="730" y="330" width="8" height="2"/>
    <rect x="732" y="338" width="4" height="2"/>
  </g>

  <!-- Skills: HUD-Panel mit Eckklammern -->
  <rect x="60" y="410" width="780" height="216" fill="#0e1524" fill-opacity=".7"/>
  <g fill="none" stroke="#58a6ff" stroke-width="2">
    <path d="M60 430V410H80"/>
    <path d="M820 410H840V430"/>
    <path d="M60 606V626H80"/>
    <path d="M820 626H840V606"/>
  </g>

  <text class="head" x="84" y="440">SKILLS.LOG <tspan class="cursor" fill="#58a6ff">&#9608;</tspan></text>
  <text class="meta" x="816" y="440">[ 5 entries ]</text>
  <line x1="84" y1="452" x2="816" y2="452" stroke="#1f6feb" stroke-opacity=".4" stroke-dasharray="2 5"/>

  <text class="label" x="84" y="480"><tspan class="idx">01 </tspan>HTML</text>
  <text class="label" x="84" y="510"><tspan class="idx">02 </tspan>CSS</text>
  <text class="label" x="84" y="540"><tspan class="idx">03 </tspan>JavaScript</text>
  <text class="label" x="84" y="570"><tspan class="idx">04 </tspan>Vue</text>
  <text class="label" x="84" y="600"><tspan class="idx">05 </tspan>Git</text>

  <!-- Balken 1:1 wie Original -->
  <g mask="url(#segs)">
    <rect x="210" y="466" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="496" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="526" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="556" width="560" height="18" fill="#1a2433"/>
    <rect x="210" y="586" width="560" height="18" fill="#1a2433"/>
    <!-- width = 560 * Prozent -->
    <rect class="bar" x="210" y="466" width="476" height="18" fill="url(#barFill)"/>
    <rect class="bar" x="210" y="496" width="448" height="18" fill="url(#barFill)" style="animation-delay:.15s"/>
    <rect class="bar" x="210" y="526" width="336" height="18" fill="url(#barFill)" style="animation-delay:.3s"/>
    <rect class="bar" x="210" y="556" width="224" height="18" fill="url(#barFill)" style="animation-delay:.45s"/>
    <rect class="bar" x="210" y="586" width="308" height="18" fill="url(#barFill)" style="animation-delay:.6s"/>
  </g>

  <text class="pct" x="816" y="480">85%</text>
  <text class="pct" x="816" y="510">80%</text>
  <text class="pct" x="816" y="540">60%</text>
  <text class="pct" x="816" y="570">40%</text>
  <text class="pct" x="816" y="600">55%</text>

  <!-- Footer: Mini-Berg -->
  <g stroke="#1f6feb" stroke-opacity=".5" stroke-dasharray="2 6">
    <line x1="300" y1="660" x2="425" y2="660"/>
    <line x1="475" y1="660" x2="600" y2="660"/>
  </g>
  <g class="pixel">
    <rect x="440" y="658" width="20" height="4" fill="#1f6feb"/>
    <rect x="444" y="654" width="12" height="4" fill="#388bfd"/>
    <rect x="448" y="650" width="4"  height="4" fill="#58a6ff"/>
    <rect x="448" y="650" width="4"  height="2" fill="#e6f3ff"/>
  </g>
</svg>
