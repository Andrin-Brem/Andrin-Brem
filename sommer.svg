<svg xmlns="http://www.w3.org/2000/svg" width="900" height="739" viewBox="0 0 900 739">
  <defs>
    <!-- Himmel -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2724"/>
      <stop offset=".55" stop-color="#1c4034"/>
      <stop offset="1" stop-color="#315b3b"/>
    </linearGradient>

    <!-- Linien oben/unten -->
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#28643c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a8cf6a"/>
      <stop offset="1" stop-color="#f4d96a"/>
    </linearGradient>

    <!-- Boden: oben Wiese, unten dunkle Erde fuer die Skills -->
    <linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="342" x2="0" y2="739">
      <stop offset="0" stop-color="#527c3e"/>
      <stop offset=".2" stop-color="#2c4d31"/>
      <stop offset=".35" stop-color="#14261d"/>
      <stop offset="1" stop-color="#0f1d17"/>
    </linearGradient>

    <!-- Skill-Balken -->
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#28643c"/>
      <stop offset=".5" stop-color="#76b94c"/>
      <stop offset="1" stop-color="#d7e88a"/>
    </linearGradient>
    <pattern id="seg" width="7" height="20" patternUnits="userSpaceOnUse">
      <rect width="5" height="20" fill="#fff"/>
    </pattern>
    <mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="739">
      <rect width="900" height="739" fill="url(#seg)"/>
    </mask>

    <!-- Pixel-Raster -->
    <pattern id="px" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
    </pattern>
    <mask id="pxMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="739">
      <rect width="900" height="739" fill="url(#px)"/>
    </mask>

    <!-- CRT-Raster ueber allem -->
    <pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0H5V5" fill="none" stroke="#101e19" stroke-width=".6" opacity=".3"/>
    </pattern>

    <!-- Sonnenblumen-Kopf (Mitte = 0,0) -->
    <g id="sunhead">
      <g fill="#f2c84d">
        <rect x="-18" y="-36" width="36" height="12"/>
        <rect x="-30" y="-24" width="60" height="12"/>
        <rect x="-36" y="-12" width="72" height="24"/>
        <rect x="-30" y="12"  width="60" height="12"/>
        <rect x="-18" y="24"  width="36" height="12"/>
      </g>
      <g fill="#f4d96a">
        <rect x="-6"  y="-42" width="12" height="6"/>
        <rect x="-6"  y="36"  width="12" height="6"/>
        <rect x="-42" y="-6"  width="6"  height="12"/>
        <rect x="36"  y="-6"  width="6"  height="12"/>
      </g>
      <g fill="#e9a84c">
        <rect x="-30" y="12" width="12" height="12"/>
        <rect x="18"  y="12" width="12" height="12"/>
        <rect x="-18" y="24" width="36" height="6"/>
      </g>
      <rect x="-18" y="-18" width="36" height="36" fill="#7a4826"/>
      <rect x="-12" y="-12" width="12" height="12" fill="#9a5a2e"/>
      <g fill="#4a2a16">
        <rect x="0"  y="0"  width="6" height="6"/>
        <rect x="6"  y="-6" width="6" height="6"/>
        <rect x="-6" y="6"  width="6" height="6"/>
      </g>
    </g>

    <!-- Blaetter am Stiel -->
    <g id="leaves" fill="#75a94c">
      <rect x="6"   y="60" width="24" height="12"/>
      <rect x="30"  y="48" width="12" height="12"/>
      <rect x="-30" y="80" width="24" height="12"/>
      <rect x="-42" y="68" width="12" height="12"/>
    </g>

    <!-- Grasbuesche -->
    <path id="tuft" d="M0 0V-20H8V-8H16V-24H24V-12H32V0Z"/>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
      .pixel { shape-rendering: crispEdges; }

      .star { animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }

      .sunglow { animation: glow 6s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
      .rayA { animation: rays 1.6s steps(1) infinite; }
      .rayB { animation: rays 1.6s steps(1) infinite -.8s; }
      @keyframes rays { 0% { opacity: 1 } 50% { opacity: .15 } }

      .cloud { animation: drift 60s linear infinite; }
      @keyframes drift { from { transform: translateX(-120px) } to { transform: translateX(1000px) } }

      .birdfly { animation: birdfly 26s linear infinite; }
      @keyframes birdfly {
        0%   { transform: translate(-60px, 0) }
        50%  { transform: translate(470px, -18px) }
        100% { transform: translate(1000px, 6px) }
      }
      .flap { transform-box: fill-box; transform-origin: center;
              animation: flap .4s ease-in-out infinite alternate; }
      @keyframes flap { from { transform: scaleY(1) } to { transform: scaleY(-.4) } }

      .bob  { animation: bob 2.4s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-8px) } }
      .spin { transform-box: fill-box; transform-origin: center;
              animation: spin 1.2s linear infinite; }
      @keyframes spin { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(.15) } }

      .sway { transform-box: fill-box; transform-origin: 50% 100%;
              animation: sway 5s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: rotate(-2deg) } to { transform: rotate(2deg) } }

      .grass { transform-box: fill-box; transform-origin: 50% 100%;
               animation: grass 3s ease-in-out infinite alternate; }
      @keyframes grass { from { transform: skewX(-6deg) } to { transform: skewX(6deg) } }

      .bee { animation: bee 6s ease-in-out infinite; }
      @keyframes bee {
        0%,100% { transform: translate(0,0) }
        25%     { transform: translate(26px,-12px) }
        50%     { transform: translate(46px,6px) }
        75%     { transform: translate(18px,16px) }
      }
      .buzz { transform-box: fill-box; transform-origin: bottom center;
              animation: buzz .12s linear infinite alternate; }
      @keyframes buzz { from { transform: scaleY(1) } to { transform: scaleY(.3) } }

      .seed { fill: #fff1a1; opacity: 0; animation: rise 10s linear infinite; }
      @keyframes rise {
        0%   { transform: translate(0,0); opacity: 0 }
        15%  { opacity: .9 }
        50%  { transform: translate(16px,-90px) }
        85%  { opacity: .4 }
        100% { transform: translate(-8px,-180px); opacity: 0 }
      }

      .gust { opacity: 0; transform-box: fill-box; transform-origin: center;
              animation: gust 14s linear infinite; }
      @keyframes gust {
        0%   { transform: translateX(0) rotate(0deg); opacity: 0 }
        8%   { opacity: .9 }
        92%  { opacity: .9 }
        100% { transform: translateX(-740px) rotate(-540deg); opacity: 0 }
      }

      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }

      .hud   { fill: #d5e99a; font-size: 11px; letter-spacing: 1px; }
      .title { fill: #e9edbd; font-size: 14px; font-weight: bold; letter-spacing: 2px; }
      .label { fill: #e5f2ce; font-size: 14px; }
      .pct   { fill: #d5e99a; font-size: 14px; text-anchor: end; }

      .bar { transform-box: fill-box; transform-origin: left center;
             animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="900" height="739" rx="12" fill="url(#sky)"/>
  <rect x="40" y="28" width="820" height="4" fill="url(#line)"/>

  <!-- Arcade-HUD -->
  <text class="hud" x="48" y="54">1UP 000420</text>
  <text class="hud" x="450" y="54" text-anchor="middle">WORLD 1-1</text>
  <text class="hud" x="852" y="54" text-anchor="end">HI 999990</text>

  <!-- Pixelsterne / Funkeln -->
  <g fill="#e8e99a" class="pixel">
    <rect class="star" x="100" y="90"  width="5" height="5"/>
    <rect class="star" x="185" y="125" width="3" height="3" style="animation-delay:-1.3s"/>
    <rect class="star" x="330" y="82"  width="4" height="4" style="animation-delay:-2.6s"/>
    <rect class="star" x="455" y="112" width="3" height="3" style="animation-delay:-.7s"/>
    <rect class="star" x="545" y="78"  width="4" height="4" style="animation-delay:-3.1s"/>
    <rect class="star" x="820" y="150" width="3" height="3" style="animation-delay:-1.8s"/>
  </g>

  <!-- Pixel-Sonne -->
  <g class="sunglow">
    <circle cx="695" cy="130" r="95" fill="#f4d96a" opacity=".05"/>
    <circle cx="695" cy="130" r="72" fill="#f4d96a" opacity=".08"/>
  </g>
  <g class="pixel">
    <g class="rayA" fill="#f4d96a">
      <rect x="690" y="62"  width="10" height="16"/>
      <rect x="690" y="182" width="10" height="16"/>
      <rect x="604" y="125" width="18" height="10"/>
      <rect x="768" y="125" width="18" height="10"/>
    </g>
    <g class="rayB" fill="#e9a84c">
      <rect x="622" y="74"  width="10" height="10"/>
      <rect x="758" y="74"  width="10" height="10"/>
      <rect x="622" y="176" width="10" height="10"/>
      <rect x="758" y="176" width="10" height="10"/>
    </g>
    <rect x="655" y="85"  width="80"  height="10" fill="#f4d96a"/>
    <rect x="640" y="95"  width="110" height="10" fill="#f4d96a"/>
    <rect x="630" y="105" width="130" height="50" fill="#f4d96a"/>
    <rect x="640" y="155" width="110" height="10" fill="#e9a84c"/>
    <rect x="655" y="165" width="80"  height="10" fill="#e9a84c"/>
    <rect x="648" y="110" width="12" height="12" fill="#fff1a1"/>
    <rect x="664" y="102" width="8"  height="8"  fill="#fff1a1"/>
  </g>

  <!-- Pixelwolken -->
  <g fill="#b2d3a0" class="pixel">
    <g transform="translate(0,135)">
      <path class="cloud" style="animation-delay:-12s" d="M0 12H20V0H52V12H72V24H0Z"/>
    </g>
    <g transform="translate(0,175)" opacity=".8">
      <path class="cloud" style="animation-delay:-40s; animation-duration:80s" d="M0 12H16V0H40V12H56V22H0Z"/>
    </g>
    <g transform="translate(0,105)" opacity=".6">
      <path class="cloud" style="animation-delay:-25s; animation-duration:95s" d="M0 8H12V0H30V8H42V16H0Z"/>
    </g>
  </g>

  <!-- Voegel -->
  <g fill="none" stroke="#0f2a20" stroke-width="2" class="pixel">
    <g transform="translate(0,150)">
      <g class="birdfly"><path class="flap" d="M0 0L5 4L10 0"/></g>
    </g>
    <g transform="translate(-30,138)">
      <g class="birdfly" style="animation-delay:-.6s"><path class="flap" d="M0 0L4 3L8 0" style="animation-delay:-.2s"/></g>
    </g>
  </g>

  <!-- Huegel im Stufen- und Pixel-Stil -->
  <g mask="url(#pxMask)" class="pixel">
    <path fill="#31583b" d="M0 300H95V276H150V260H235V278H300V248H390V266H470V286H550V260H650V280H730V252H810V274H900V410H0Z"/>
    <path fill="#416d42" d="M0 335H120V315H220V294H310V310H410V290H510V314H610V292H710V313H810V290H900V420H0Z"/>
  </g>

  <!-- Muenzen ueber dem Huegel -->
  <g fill="#f4d96a" class="pixel">
    <g transform="translate(275,215)"><g class="bob"><g class="spin">
      <rect x="2" y="0" width="8" height="2"/><rect x="0" y="2" width="12" height="8"/><rect x="2" y="10" width="8" height="2"/>
      <rect x="5" y="3" width="2" height="6" fill="#e9a84c"/>
    </g></g></g>
    <g transform="translate(305,215)"><g class="bob" style="animation-delay:-.4s"><g class="spin" style="animation-delay:-.2s">
      <rect x="2" y="0" width="8" height="2"/><rect x="0" y="2" width="12" height="8"/><rect x="2" y="10" width="8" height="2"/>
      <rect x="5" y="3" width="2" height="6" fill="#e9a84c"/>
    </g></g></g>
    <g transform="translate(335,215)"><g class="bob" style="animation-delay:-.8s"><g class="spin" style="animation-delay:-.4s">
      <rect x="2" y="0" width="8" height="2"/><rect x="0" y="2" width="12" height="8"/><rect x="2" y="10" width="8" height="2"/>
      <rect x="5" y="3" width="2" height="6" fill="#e9a84c"/>
    </g></g></g>
  </g>

  <!-- Sonnenblumen hinten -->
  <g class="pixel">
    <g transform="translate(150,235)">
      <g class="sway">
        <rect x="-6" y="36" width="12" height="104" fill="#426c36"/>
        <use href="#leaves"/>
        <use href="#sunhead"/>
      </g>
    </g>
    <g transform="translate(420,275) scale(.65)">
      <g class="sway" style="animation-delay:-2s; animation-duration:6s">
        <rect x="-6" y="36" width="12" height="125" fill="#426c36"/>
        <use href="#leaves"/>
        <use href="#sunhead"/>
      </g>
    </g>
    <g transform="translate(780,255) scale(.85)">
      <g class="sway" style="animation-delay:-3.5s; animation-duration:5.5s">
        <rect x="-6" y="36" width="12" height="105" fill="#426c36"/>
        <use href="#leaves"/>
        <use href="#sunhead"/>
      </g>
    </g>
  </g>

  <!-- Boden vorne -->
  <path class="pixel" fill="url(#ground)"
    d="M0 370H90V355H180V370H280V345H370V365H470V350H560V368H660V342H760V360H900V739H0Z"/>
  <path class="pixel" fill="none" stroke="#85a84e" stroke-width="5"
    d="M0 400H140V388H260V402H400V382H540V400H680V385H810V400H900"/>

  <!-- Sonnenblumen vorne -->
  <g class="pixel">
    <g transform="translate(85,330) scale(.9)">
      <g class="sway" style="animation-delay:-1s; animation-duration:4.5s">
        <rect x="-6" y="36" width="12" height="69" fill="#46743b"/>
        <use href="#leaves"/>
        <use href="#sunhead"/>
      </g>
    </g>
    <g transform="translate(640,355) scale(.55)">
      <g class="sway" style="animation-delay:-2.5s; animation-duration:4s">
        <rect x="-6" y="36" width="12" height="91" fill="#46743b"/>
        <use href="#leaves"/>
        <use href="#sunhead"/>
      </g>
    </g>
  </g>

  <!-- Bienen -->
  <g class="pixel">
    <g transform="translate(195,210)">
      <g class="bee">
        <rect class="buzz" x="2" y="-4" width="4" height="4" fill="#e5f2ce" opacity=".8"/>
        <rect x="0" y="0" width="9" height="5" fill="#f4d96a"/>
        <rect x="3" y="0" width="2" height="5" fill="#1b2a20"/>
        <rect x="7" y="0" width="2" height="5" fill="#1b2a20"/>
      </g>
    </g>
    <g transform="translate(720,235)">
      <g class="bee" style="animation-delay:-3s; animation-duration:7s">
        <rect class="buzz" x="2" y="-4" width="4" height="4" fill="#e5f2ce" opacity=".8"/>
        <rect x="0" y="0" width="9" height="5" fill="#f4d96a"/>
        <rect x="3" y="0" width="2" height="5" fill="#1b2a20"/>
        <rect x="7" y="0" width="2" height="5" fill="#1b2a20"/>
      </g>
    </g>
  </g>

  <!-- Aufsteigende Pollen -->
  <rect class="seed" x="150" y="230" width="3" height="3"/>
  <rect class="seed" x="420" y="270" width="3" height="3" style="animation-delay:-3s; animation-duration:12s"/>
  <rect class="seed" x="780" y="250" width="3" height="3" style="animation-delay:-6s"/>
  <rect class="seed" x="85"  y="325" width="2" height="2" style="animation-delay:-1.5s; animation-duration:11s"/>
  <rect class="seed" x="640" y="350" width="2" height="2" style="animation-delay:-4.5s"/>
  <rect class="seed" x="520" y="380" width="2" height="2" style="animation-delay:-8s; animation-duration:9s"/>

  <!-- Gras, Bluemchen, Steine -->
  <g fill="#9bc45a" class="pixel">
    <g transform="translate(20,428)"><use class="grass" href="#tuft"/></g>
    <g transform="translate(175,428)"><use class="grass" href="#tuft" style="animation-delay:-.7s"/></g>
    <g transform="translate(310,428)"><use class="grass" href="#tuft" style="animation-delay:-1.4s"/></g>
    <g transform="translate(500,428)"><use class="grass" href="#tuft" style="animation-delay:-.3s"/></g>
    <g transform="translate(700,428)"><use class="grass" href="#tuft" style="animation-delay:-2s"/></g>
    <g transform="translate(835,428)"><use class="grass" href="#tuft" style="animation-delay:-1s"/></g>
  </g>
  <g class="pixel">
    <rect x="267" y="414" width="2" height="12" fill="#9bc45a"/><rect x="265" y="408" width="6" height="6" fill="#f1d65d"/>
    <rect x="287" y="406" width="2" height="20" fill="#9bc45a"/><rect x="285" y="400" width="6" height="6" fill="#f1d65d"/>
    <rect x="557" y="416" width="2" height="10" fill="#9bc45a"/><rect x="555" y="410" width="6" height="6" fill="#fff1a1"/>
    <rect x="737" y="410" width="2" height="16" fill="#9bc45a"/><rect x="735" y="404" width="6" height="6" fill="#f1d65d"/>
    <rect x="430" y="418" width="18" height="8" fill="#8d9870"/>
    <rect x="434" y="414" width="10" height="4" fill="#a4ae84"/>
    <rect x="785" y="420" width="14" height="6" fill="#b1a77a"/>
  </g>

  <!-- Trennlinie -->
  <rect x="48" y="436" width="804" height="2" fill="#9fc56b"/>
  <rect x="48" y="441" width="804" height="1" fill="#d5e99a" opacity=".4"/>

  <!-- Skills -->
  <text class="title" x="90" y="474"><tspan class="blink" fill="#f4d96a">&#9654;</tspan> PLAYER STATS</text>
  <path d="M260 470H800" stroke="#2c4d31" stroke-dasharray="3 6"/>

  <text class="label" x="90" y="502">HTML</text>
  <text class="label" x="90" y="531">CSS</text>
  <text class="label" x="90" y="560">JavaScript</text>
  <text class="label" x="90" y="589">Vue</text>
  <text class="label" x="90" y="618">Git</text>

  <g mask="url(#segs)">
    <rect x="204" y="488" width="526" height="18" fill="#172b20"/>
    <rect x="204" y="517" width="526" height="18" fill="#172b20"/>
    <rect x="204" y="546" width="526" height="18" fill="#172b20"/>
    <rect x="204" y="575" width="526" height="18" fill="#172b20"/>
    <rect x="204" y="604" width="526" height="18" fill="#172b20"/>
    <!-- width = 526 * Prozent -->
    <rect class="bar" x="204" y="488" width="473.4" height="18" fill="url(#bar)" style="animation-delay:.2s"/>
    <rect class="bar" x="204" y="517" width="420.8" height="18" fill="url(#bar)" style="animation-delay:.65s"/>
    <rect class="bar" x="204" y="546" width="368.2" height="18" fill="url(#bar)" style="animation-delay:1.1s"/>
    <rect class="bar" x="204" y="575" width="210.4" height="18" fill="url(#bar)" style="animation-delay:1.55s"/>
    <rect class="bar" x="204" y="604" width="315.6" height="18" fill="url(#bar)" style="animation-delay:2s"/>
  </g>

  <text class="pct" x="800" y="502">90%</text>
  <text class="pct" x="800" y="531">80%</text>
  <text class="pct" x="800" y="560">70%</text>
  <text class="pct" x="800" y="589">40%</text>
  <text class="pct" x="800" y="618">60%</text>

  <!-- Vom Wind verwehte Bluetenblaetter -->
  <rect class="gust" x="820" y="632" width="5" height="5" fill="#f2c84d"/>
  <rect class="gust" x="820" y="635" width="4" height="4" fill="#f4d96a" style="animation-delay:-5s; animation-duration:16s"/>
  <rect class="gust" x="820" y="630" width="5" height="5" fill="#e9a84c" style="animation-delay:-10s; animation-duration:13s"/>

  <rect x="48" y="646" width="804" height="2" fill="#9fc56b"/>

  <!-- Footer -->
  <text x="450" y="676" text-anchor="middle" font-size="12" letter-spacing="2" fill="#c5dba0">SUMMER LEVEL // STAGE 01</text>
  <text class="blink" x="450" y="696" text-anchor="middle" font-size="10" letter-spacing="2" fill="#829d70">INSERT COIN TO EXPLORE</text>

  <rect x="40" y="708" width="820" height="4" fill="url(#line)"/>

  <!-- CRT-Raster + Rahmen -->
  <rect width="900" height="739" rx="12" fill="url(#grid)" opacity=".22"/>
  <rect x="12" y="12" width="876" height="715" rx="8" fill="none" stroke="#8dbb65" stroke-width="2"/>
</svg>

