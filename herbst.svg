<svg xmlns="http://www.w3.org/2000/svg" width="900" height="810" viewBox="0 0 900 810">
  <defs>
    <!-- Linien oben/unten -->
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#3d1e0a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c2541a"/>
      <stop offset="1" stop-color="#f0883e"/>
    </linearGradient>

    <!-- Skill-Balken (Stil wie im Bild) -->
    <linearGradient id="barFill" x1="0" x2="1">
      <stop offset="0" stop-color="#a3400f"/>
      <stop offset="0.6" stop-color="#e07a2e"/>
      <stop offset="1" stop-color="#ffc66d"/>
    </linearGradient>
    <pattern id="seg" width="8" height="20" patternUnits="userSpaceOnUse">
      <rect width="6" height="20" fill="#fff"/>
    </pattern>
    <mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="810">
      <rect width="900" height="810" fill="url(#seg)"/>
    </mask>

    <!-- Pixel-Raster fuer die Baumkronen -->
    <pattern id="px" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
    </pattern>
    <mask id="pxMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="810">
      <rect width="900" height="810" fill="url(#px)"/>
    </mask>

    <!-- Leuchtende Krone -->
    <radialGradient id="crown" cx=".5" cy=".42" r=".55">
      <stop offset="0"   stop-color="#ffe09a"/>
      <stop offset=".3"  stop-color="#f7b955"/>
      <stop offset=".55" stop-color="#e0702c"/>
      <stop offset=".8"  stop-color="#9a3a12"/>
      <stop offset="1"   stop-color="#4a1a08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crownDim" cx=".5" cy=".45" r=".55">
      <stop offset="0"   stop-color="#e8873a"/>
      <stop offset=".5"  stop-color="#b14d1a"/>
      <stop offset=".85" stop-color="#6b2a10"/>
      <stop offset="1"   stop-color="#3a1506" stop-opacity="0"/>
    </radialGradient>

    <!-- Erntemond -->
    <radialGradient id="moon" cx=".4" cy=".4" r=".6">
      <stop offset="0" stop-color="#ffe7b0"/>
      <stop offset=".7" stop-color="#f5b14c"/>
      <stop offset="1" stop-color="#d9692a"/>
    </radialGradient>

    <style>
      text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }

      .star { fill: #f5c27a; animation: twinkle 4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }

      .moon { animation: glow 7s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .8 } 50% { opacity: 1 } }

      .crowns { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .85 } 50% { opacity: 1 } }

      .leaf { font-size: 14px; opacity: 0; transform-box: fill-box; transform-origin: center;
              animation: leaf 12s linear infinite; }
      @keyframes leaf {
        0%   { transform: translate(0,0) rotate(0deg); opacity: 0 }
        10%  { opacity: .95 }
        35%  { transform: translate(-22px,100px) rotate(120deg) }
        65%  { transform: translate(18px,200px) rotate(240deg) }
        90%  { opacity: .7 }
        100% { transform: translate(-6px,290px) rotate(360deg); opacity: 0 }
      }

      .gust { font-size: 13px; opacity: 0; transform-box: fill-box; transform-origin: center;
              animation: gust 14s linear infinite; }
      @keyframes gust {
        0%   { transform: translateX(0) rotate(0deg); opacity: 0 }
        8%   { opacity: .9 }
        92%  { opacity: .9 }
        100% { transform: translateX(-760px) rotate(-720deg); opacity: 0 }
      }

      .fly { fill: #ffd27a; animation: fly 5s ease-in-out infinite alternate; }
      @keyframes fly {
        0%   { transform: translate(0,0); opacity: .1 }
        50%  { opacity: 1 }
        100% { transform: translate(14px,-18px); opacity: .2 }
      }

      .reed { animation: sway 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
      @keyframes sway { from { transform: rotate(-2deg) } to { transform: rotate(2deg) } }

      .title { fill: #f0a040; font-size: 14px; letter-spacing: 1px; }
      .label { fill: #f0b060; font-size: 14px; }
      .pct   { fill: #d98a4a; font-size: 14px; text-anchor: end; }

      .bar   { transform-box: fill-box; transform-origin: left center;
               animation: grow 1.8s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }

      .dot   { fill: #e07a2e; font-size: 13px; text-anchor: middle; animation: twinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Hintergrund -->
  <rect width="900" height="810" rx="12" fill="#0d1117"/>
  <rect x="30" y="30" width="840" height="4" fill="url(#line)"/>

  <!-- Sterne -->
  <circle class="star" cx="90"  cy="70"  r="1.2"/>
  <circle class="star" cx="230" cy="95"  r="1"   style="animation-delay:-1.4s"/>
  <circle class="star" cx="330" cy="60"  r="1.4" style="animation-delay:-2.7s"/>
  <circle class="star" cx="420" cy="105" r="1"   style="animation-delay:-.6s"/>
  <circle class="star" cx="560" cy="70"  r="1.3" style="animation-delay:-3.2s"/>
  <circle class="star" cx="640" cy="120" r="1"   style="animation-delay:-1.9s"/>
  <circle class="star" cx="850" cy="150" r="1.2" style="animation-delay:-2.3s"/>

  <!-- Erntemond -->
  <g class="moon">
    <circle cx="770" cy="95" r="48" fill="#f0883e" opacity=".06"/>
    <circle cx="770" cy="95" r="34" fill="#f0883e" opacity=".08"/>
    <g mask="url(#pxMask)">
      <circle cx="770" cy="95" r="24" fill="url(#moon)"/>
    </g>
  </g>

  <!-- Schilf (sanft schwankend) -->
  <g stroke="#3f6e52" stroke-width="2">
    <line class="reed" x1="58"  y1="432" x2="58"  y2="300"/>
    <line class="reed" x1="66"  y1="432" x2="68"  y2="340" style="animation-delay:-1s"/>
    <line class="reed" x1="372" y1="432" x2="374" y2="330" style="animation-delay:-2s"/>
    <line class="reed" x1="525" y1="432" x2="523" y2="350" style="animation-delay:-3s"/>
    <line class="reed" x1="840" y1="432" x2="838" y2="320" style="animation-delay:-1.5s"/>
    <line class="reed" x1="848" y1="432" x2="850" y2="360" style="animation-delay:-2.5s"/>
  </g>

  <!-- Staemme -->
  <g stroke="#6e4128" stroke-width="2">
    <line x1="150" y1="290" x2="150" y2="432"/>
    <line x1="290" y1="350" x2="290" y2="432"/>
    <line x1="450" y1="280" x2="450" y2="432"/>
    <line x1="595" y1="355" x2="595" y2="432"/>
    <line x1="730" y1="300" x2="730" y2="432"/>
  </g>

  <!-- Baumkronen im Pixel-Stil (hohe, schmale Pappel-Form) -->
  <g class="crowns" mask="url(#pxMask)">
    <ellipse cx="150" cy="225" rx="50" ry="80" fill="url(#crown)"/>
    <ellipse cx="290" cy="315" rx="32" ry="46" fill="url(#crownDim)"/>
    <ellipse cx="450" cy="205" rx="58" ry="92" fill="url(#crown)"/>
    <ellipse cx="595" cy="322" rx="30" ry="42" fill="url(#crownDim)"/>
    <ellipse cx="730" cy="240" rx="46" ry="74" fill="url(#crown)"/>
    <!-- kleine Buesche am Boden -->
    <ellipse cx="215" cy="420" rx="26" ry="14" fill="url(#crownDim)"/>
    <ellipse cx="520" cy="422" rx="22" ry="12" fill="url(#crownDim)"/>
    <ellipse cx="800" cy="420" rx="24" ry="14" fill="url(#crownDim)"/>
  </g>

  <!-- ASCII-Aeste -->
  <g fill="#a0623a" font-size="13" text-anchor="middle" xml:space="preserve">
    <text x="150" y="300">\ | /</text>
    <text x="150" y="314"> \|/ </text>
    <text x="290" y="358">\|/</text>
    <text x="450" y="292">\ | /</text>
    <text x="450" y="306"> \|/ </text>
    <text x="595" y="362">\|/</text>
    <text x="730" y="310">\ | /</text>
    <text x="730" y="324"> \|/ </text>
  </g>

  <!-- Gluehwuermchen -->
  <circle class="fly" cx="210" cy="360" r="1.6"/>
  <circle class="fly" cx="360" cy="270" r="1.4" style="animation-delay:-1.5s"/>
  <circle class="fly" cx="530" cy="300" r="1.6" style="animation-delay:-3s"/>
  <circle class="fly" cx="660" cy="380" r="1.3" style="animation-delay:-2s"/>
  <circle class="fly" cx="810" cy="290" r="1.5" style="animation-delay:-4s"/>

  <!-- Fallende Blaetter -->
  <text class="leaf" x="120" y="140" fill="#e8833a">&#10086;</text>
  <text class="leaf" x="185" y="160" fill="#f0a040" style="animation-delay:-3s; animation-duration:14s">&#10087;</text>
  <text class="leaf" x="260" y="130" fill="#c2541a" style="animation-delay:-6s">&#10086;</text>
  <text class="leaf" x="330" y="150" fill="#f0a040" style="animation-delay:-9s; animation-duration:11s">&#10087;</text>
  <text class="leaf" x="420" y="120" fill="#e8833a" style="animation-delay:-1.5s; animation-duration:13s">&#10086;</text>
  <text class="leaf" x="490" y="140" fill="#c2541a" style="animation-delay:-7.5s">&#10087;</text>
  <text class="leaf" x="560" y="160" fill="#f0a040" style="animation-delay:-4.5s; animation-duration:15s">&#10086;</text>
  <text class="leaf" x="640" y="135" fill="#e8833a" style="animation-delay:-10s">&#10087;</text>
  <text class="leaf" x="700" y="150" fill="#c2541a" style="animation-delay:-2.5s; animation-duration:12s">&#10086;</text>
  <text class="leaf" x="790" y="170" fill="#f0a040" style="animation-delay:-8.5s; animation-duration:14s">&#10087;</text>

  <!-- Boden + Laubhaufen -->
  <line x1="45" y1="434" x2="855" y2="434" stroke="#8b5a3c"/>
  <g font-size="11" opacity=".75">
    <text x="130" y="430" fill="#c2541a">&#10087;</text>
    <text x="168" y="431" fill="#e8833a">&#10086;</text>
    <text x="410" y="430" fill="#f0a040">&#10087;</text>
    <text x="470" y="431" fill="#c2541a">&#10086;</text>
    <text x="700" y="430" fill="#e8833a">&#10087;</text>
    <text x="752" y="431" fill="#f0a040">&#10086;</text>
  </g>

  <!-- Skills -->
  <text class="title" x="62" y="518">the toolbox</text>
  <line x1="175" y1="514" x2="805" y2="514" stroke="#8b5a3c" stroke-opacity=".7" stroke-dasharray="4 3"/>

  <text class="label" x="62" y="552">HTML</text>
  <text class="label" x="62" y="577">CSS</text>
  <text class="label" x="62" y="602">JavaScript</text>
  <text class="label" x="62" y="627">Vue</text>
  <text class="label" x="62" y="652">Git</text>

  <g mask="url(#segs)">
    <rect x="180" y="540" width="550" height="16" fill="#24170f"/>
    <rect x="180" y="565" width="550" height="16" fill="#24170f"/>
    <rect x="180" y="590" width="550" height="16" fill="#24170f"/>
    <rect x="180" y="615" width="550" height="16" fill="#24170f"/>
    <rect x="180" y="640" width="550" height="16" fill="#24170f"/>
    <!-- width = 550 * Prozent -->
    <rect class="bar" x="180" y="540" width="468" height="16" fill="url(#barFill)"/>
    <rect class="bar" x="180" y="565" width="440" height="16" fill="url(#barFill)" style="animation-delay:.15s"/>
    <rect class="bar" x="180" y="590" width="330" height="16" fill="url(#barFill)" style="animation-delay:.3s"/>
    <rect class="bar" x="180" y="615" width="220" height="16" fill="url(#barFill)" style="animation-delay:.45s"/>
    <rect class="bar" x="180" y="640" width="303" height="16" fill="url(#barFill)" style="animation-delay:.6s"/>
  </g>

  <text class="pct" x="805" y="552">85%</text>
  <text class="pct" x="805" y="577">80%</text>
  <text class="pct" x="805" y="602">60%</text>
  <text class="pct" x="805" y="627">40%</text>
  <text class="pct" x="805" y="652">55%</text>

  <!-- Vom Wind verwehte Blaetter unter den Balken -->
  <text class="gust" x="820" y="688" fill="#e8833a">&#10087;</text>
  <text class="gust" x="820" y="692" fill="#c2541a" style="animation-delay:-5s; animation-duration:16s">&#10086;</text>
  <text class="gust" x="820" y="686" fill="#f0a040" style="animation-delay:-10s; animation-duration:13s">&#10087;</text>

  <line x1="45" y1="705" x2="855" y2="705" stroke="#8b5a3c"/>

  <!-- Deko unten -->
  <text class="dot" x="340" y="755">&#10086;</text>
  <text class="dot" x="368" y="755" style="animation-delay:-.3s">&#183;</text>
  <text class="dot" x="396" y="755" style="animation-delay:-.6s">&#10022;</text>
  <text class="dot" x="424" y="755" style="animation-delay:-.9s">&#183;</text>
  <text class="dot" x="452" y="755" style="animation-delay:-1.2s">&#10087;</text>
  <text class="dot" x="480" y="755" style="animation-delay:-1.5s">&#183;</text>
  <text class="dot" x="508" y="755" style="animation-delay:-1.8s">&#10022;</text>
  <text class="dot" x="536" y="755" style="animation-delay:-2.1s">&#183;</text>
  <text class="dot" x="564" y="755" style="animation-delay:-2.4s">&#10086;</text>

  <rect x="30" y="782" width="840" height="4" fill="url(#line)"/>
</svg>
