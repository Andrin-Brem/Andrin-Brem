
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 739">
<defs>
  <linearGradient id="sky" x2="0" y2="1">
    <stop stop-color="#171b18"/><stop offset="1" stop-color="#49301f"/>
  </linearGradient>
  <linearGradient id="ground" x2="0" y2="1">
    <stop stop-color="#79502f"/><stop offset="1" stop-color="#30251c"/>
  </linearGradient>
  <linearGradient id="bar" x2="1">
    <stop stop-color="#704323"/><stop offset=".5" stop-color="#bd7938"/><stop offset="1" stop-color="#f0cb83"/>
  </linearGradient>
  <pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse">
    <path d="M0 0H5V5" fill="none" stroke="#1b2119" stroke-width=".7" opacity=".4"/>
  </pattern>
  <pattern id="segments" width="7" height="18" patternUnits="userSpaceOnUse">
    <path d="M4 0V18" stroke="#241d17" stroke-width="2" opacity=".65"/>
  </pattern>
  <style>
    @keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .fill{transform-box:fill-box;transform-origin:left center;animation:reveal 1.4s cubic-bezier(.2,.8,.2,1) both}
    .a{animation-delay:.2s}.b{animation-delay:.65s}.c{animation-delay:1.1s}.d{animation-delay:1.55s}.e{animation-delay:2s}
    .label{font:13px monospace;fill:#f1e2c9}
    .pct{font:12px monospace;fill:#e8c77b}
    .pixel{shape-rendering:crispEdges}
  </style>
</defs>

<rect width="900" height="739" fill="url(#sky)"/>
<rect x="48" y="45" width="768" height="3" fill="#bd7938"/>
<rect x="48" y="52" width="768" height="1" fill="#f0cb83" opacity=".35"/>

<!-- Stars -->
